site_name: Data Layer Spec
repo_url: https://github.com/searchdiscovery/client-nyl-aarp-dl-spec
repo_name: searchdiscovery/client-nyl-aarp-dl-spec
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    primary: indigo
  features:
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.expand
    - navigation.top
markdown_extensions:
  - admonition
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
plugins:
  - git-revision-date
nav:
  - Home:
    - index.md
  - Specification:
    - Overview: specification/index.md
    - Bookend events:
      - specification/bookend_events/index.md
      - State Initialized: specification/bookend_events/state_initialized.md
      - State Completed: specification/bookend_events/state_completed.md
    - Standard events:
      - specification/standard_events/index.md
      - Page Data: specification/standard_events/page_data.md
      - Form Info: specification/standard_events/form_info.md
    - Features:
      - specification/features/index.md
      - First Notice of Loss: specification/features/fnol.md
      - Customer Service Website:
        - specification/features/csw/index.md
        - Edit Beneficiary: specification/features/csw/edit_bene.md
  - Reference:
    - Launch installation instructions: launch_installation/index.md
    - Resource representations:
      - page: specification/standard_events/resource_representations/page.md
      - form: specification/standard_events/resource_representations/form.md